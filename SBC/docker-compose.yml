services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped

  mqtt-to-influx:
    build: ./mqtt-to-influx
    container_name: mqtt-to-influx
    depends_on:
      - mosquitto
      - influxdb
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_SENSOR_DATA: ${MQTT_TOPIC_SENSOR_DATA}

      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    restart: unless-stopped

  read-from-arduino:
    build: ./read_from_arduino
    container_name: read-from-arduino
    user: root
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_SENSOR_DATA: ${MQTT_TOPIC_SENSOR_DATA}
    restart: unless-stopped
    
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    restart: unless-stopped
  
  ml-service:
    build: ./ml-service
    container_name: ml-service
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_SENSOR_DATA: ${MQTT_TOPIC_SENSOR_DATA}
      MQTT_COMMAND_TOPIC: ${MQTT_COMMAND_TOPIC}
      MQTT_TOPIC_CONFIG: ${MQTT_TOPIC_CONFIG}
    restart: unless-stopped
  
  api-service:
    build: ./api-service
    restart: unless-stopped
    ports:
      - "8000:8000"       # Flutter app connects to Pi-IP:8000
    depends_on:
      - mosquitto
      - influxdb
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_SENSOR_DATA: sensors/arduino
      MQTT_TOPIC_ACTUATOR: actuator/command
      MQTT_TOPIC_CONFIG: ml/config
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ips
      INFLUX_BUCKET: acceleration_data
    networks:
      - iot-net